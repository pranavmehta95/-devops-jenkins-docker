<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Pipeline Status</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #b0c4de;
            --accent-color: #00ffcc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: -webkit-linear-gradient(45deg, #00ffcc, #33ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .status-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .status-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .status-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-value {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .value-running {
            color: #00ff66;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background-color: #00ff66;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
            animation: pulsate 1.5s infinite ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulsate {
            0% { transform: scale(0.8); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.7; }
        }

        /* Loading spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error-msg {
            color: #ff4c4c;
            display: none;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>System Status</h1>
        <p class="subtitle">Real-time pipeline overview</p>

        <div id="loader" class="loader"></div>
        <div id="error-msg">Failed to load API status. Is the backend running?</div>

        <div id="status-content" class="status-grid" style="display: none;">
            <div class="status-item">
                <span class="status-label">Pipeline Message</span>
                <span id="val-message" class="status-value">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">App Version</span>
                <span id="val-version" class="status-value">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">System State</span>
                <span class="status-value value-running">
                    <span class="pulse"></span>
                    <span id="val-status">-</span>
                </span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('/api/status')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('status-content').style.display = 'grid';
                    
                    document.getElementById('val-message').textContent = data.message || 'N/A';
                    document.getElementById('val-version').textContent = data.version || 'N/A';
                    document.getElementById('val-status').textContent = (data.status || 'N/A').toUpperCase();
                })
                .catch(error => {
                    console.error('Error fetching status:', error);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('error-msg').style.display = 'block';
                });
        });
    </script>
</body>
</html>
